[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_transducer"
version = "0.2.1"
description = "Neural transducer for grapheme-to-phoneme (Makarov & Clematide 2020)"
authors = [
    { name = "Peter Makarov", email = "makarov@cl.uzh.ch" },
    { name = "Simon Clematide" },
    { name = "Silvan Wehrli" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10, <3.14"

dependencies = [
    "Cython>=0.29",
    "torch>=2.6",
    "editdistance>=0.5.2",
    "numpy>=1.19",
    "progressbar>=2.5",
    "scipy>=1.5.4",
]

[tool.setuptools]
packages = ["trans"]

[project.scripts]
trans-train = "trans.train:cli_main"
trans-ensemble = "trans.ensembling:cli_main"
trans-grid-search = "trans.grid_search:cli_main"
trans-analyze-sed = "trans.analyze_sed:cli_main"
